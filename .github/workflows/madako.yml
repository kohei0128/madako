name: Madako

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: uv build
      - name: Install core wheel in an isolated environment
        run: |
          wheel="$(realpath dist/*.whl)"
          python -m venv "$RUNNER_TEMP/madako-smoke"
          "$RUNNER_TEMP/madako-smoke/bin/pip" install "$wheel"
          "$RUNNER_TEMP/madako-smoke/bin/python" -c "import importlib.util; import importlib.metadata; import madako; assert madako.__version__ == importlib.metadata.version('madako'); assert importlib.util.find_spec('data_profile') is None; assert importlib.util.find_spec('fastapi') is None"
          "$RUNNER_TEMP/madako-smoke/bin/pip" install "mypy>=1.15.0,<2"
          test ! -e "$RUNNER_TEMP/madako-smoke/bin/data-profile"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/madako-smoke/bin/mypy" --strict "$GITHUB_WORKSPACE/tests/typing/public_api.py"
          "$RUNNER_TEMP/madako-smoke/bin/madako" build-sample --output-dir sample-profile
          "$RUNNER_TEMP/madako-smoke/bin/python" -c "from madako import DataProfile; assert DataProfile.from_storage('sample-profile').models()"
          "$RUNNER_TEMP/madako-smoke/bin/pip" install "$wheel[web]"
          "$RUNNER_TEMP/madako-smoke/bin/python" -c "from madako.server import WEB_DIST_DIR, create_app; assert WEB_DIST_DIR.joinpath('index.html').is_file(); create_app()"
      - name: Use the wheel from a separate minimal dbt project
        run: |
          cp -R e2e/minimal_dbt_project "$RUNNER_TEMP/external-dbt-project"
          (
            cd "$RUNNER_TEMP/external-dbt-project"
            "$RUNNER_TEMP/madako-smoke/bin/madako" import-dbt
          )
          "$RUNNER_TEMP/madako-smoke/bin/python" -c "from madako import DataProfile; assert DataProfile.from_storage('$RUNNER_TEMP/external-dbt-project/.madako-profile').models()"
          "$RUNNER_TEMP/madako-smoke/bin/python" e2e/verify_external_project.py \
            --project-dir "$RUNNER_TEMP/external-dbt-project" \
            --storage-dir "$RUNNER_TEMP/external-profile"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
