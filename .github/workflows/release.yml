name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - id: release-version
        name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release_version.py "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - run: uv sync --frozen
      - run: uv run pytest
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: uv build
      - run: python scripts/verify_package_contents.py dist
      - run: uvx --from 'twine==6.2.0' twine check dist/*
      - name: Upload tested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: madako-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/madako/${{ needs.build-and-test.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: madako-distributions
          path: dist
      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  smoke-testpypi:
    needs: [build-and-test, publish-testpypi]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: madako-distributions
          path: dist
      - name: Download the published wheel from TestPyPI
        env:
          PACKAGE_VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          set -euo pipefail
          testpypi_dir="$RUNNER_TEMP/testpypi-dist"
          mkdir -p "$testpypi_dir"
          for attempt in {1..12}; do
            if python -m pip download \
              --no-deps \
              --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest "$testpypi_dir" \
              "madako==$PACKAGE_VERSION"; then
              exit 0
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "TestPyPI did not make madako==$PACKAGE_VERSION available in time" >&2
              exit 1
            fi
            rm -f "$testpypi_dir"/*
            sleep 10
          done
      - name: Verify and smoke-test the TestPyPI wheel
        env:
          PACKAGE_VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          set -euo pipefail
          built_wheel="$(realpath dist/*.whl)"
          published_wheel="$(realpath "$RUNNER_TEMP"/testpypi-dist/*.whl)"
          cmp "$built_wheel" "$published_wheel"

          smoke_env="$RUNNER_TEMP/madako-testpypi-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/pip" install "$published_wheel[web]"
          "$smoke_env/bin/python" -c "import importlib.metadata; import os; assert importlib.metadata.version('madako') == os.environ['PACKAGE_VERSION']"
          "$smoke_env/bin/madako" --help
          "$smoke_env/bin/madako" build-sample --output-dir "$RUNNER_TEMP/sample-profile"
          "$smoke_env/bin/python" -c "from madako import DataProfile; assert DataProfile.from_storage('$RUNNER_TEMP/sample-profile').models()"
          "$smoke_env/bin/python" -c "from madako.server import WEB_DIST_DIR, create_app; assert WEB_DIST_DIR.joinpath('index.html').is_file(); create_app()"

  publish-pypi:
    needs: [build-and-test, smoke-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/madako/${{ needs.build-and-test.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: madako-distributions
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
