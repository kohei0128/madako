name: Data Profile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Install core wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/data-profile-smoke"
          "$RUNNER_TEMP/data-profile-smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/data-profile-smoke/bin/python" -c "import importlib.util; import data_profile; assert importlib.util.find_spec('fastapi') is None"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/data-profile-smoke/bin/data-profile" build-sample --output-dir sample-profile
          "$RUNNER_TEMP/data-profile-smoke/bin/python" -c "from data_profile import DataProfile; assert DataProfile.from_storage('sample-profile').models()"
      - name: Use the wheel from a separate minimal dbt project
        run: |
          cp -R e2e/minimal_dbt_project "$RUNNER_TEMP/external-dbt-project"
          "$RUNNER_TEMP/data-profile-smoke/bin/python" e2e/verify_external_project.py \
            --project-dir "$RUNNER_TEMP/external-dbt-project" \
            --storage-dir "$RUNNER_TEMP/external-profile"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
