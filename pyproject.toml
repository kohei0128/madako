[project]
name = "madako"
version = "0.1.0"
description = "Madako: a local-first catalog combining dbt metadata with data profiles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "kohei0128" },
]
keywords = ["bigquery", "data-catalog", "data-profiling", "dbt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11.0,<3",
    "duckdb>=1.4.0,<2",
]

[project.urls]
Documentation = "https://github.com/kohei0128/madako#readme"
Issues = "https://github.com/kohei0128/madako/issues"
Source = "https://github.com/kohei0128/madako"

[project.optional-dependencies]
web = [
    "fastapi>=0.116.0,<1",
    "uvicorn>=0.35.0,<1",
]

[project.scripts]
madako = "madako.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.0,<1",
    "mypy>=1.15.0,<2",
    "pytest>=8.4.0,<9",
    "uvicorn>=0.35.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/madako"]
exclude = [
    "/src/madako/**/__pycache__",
    "/src/madako/**/*.pyc",
]

# Keep the source archive limited to files needed to rebuild the wheel.
# The prebuilt web_dist is included so rebuilding does not require Node.js.
# Hatchling also adds PKG-INFO and the VCS ignore file automatically.
[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/src/madako",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
exclude = [
    "/src/madako/**/__pycache__",
    "/src/madako/**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
