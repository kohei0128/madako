[project]
name = "madako"
version = "0.1.0"
description = "Madako: a local-first catalog combining dbt metadata with data profiles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11.0,<3",
    "duckdb>=1.4.0,<2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.116.0,<1",
    "uvicorn>=0.35.0,<1",
]

[project.scripts]
madako = "madako.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.0,<1",
    "mypy>=1.15.0,<2",
    "pytest>=8.4.0,<9",
    "uvicorn>=0.35.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/madako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
